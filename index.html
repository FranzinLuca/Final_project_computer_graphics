<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drum Rig — Interactive Graphics</title>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three/build/three.module.js",
    "three/addons/": "./lib/three/addons/",
    "@tweenjs/tween.js": "./lib/tween/tween.esm.js",
    "lil-gui": "./lib/lil-gui/lil-gui.esm.js"
  }
}
</script>

<style>
  /*
    The overlay palette is the authored scene palette, matching src/palette.js.

    It is worth being precise about "matching": these are the values the
    backdrop is authored as, not the values it renders as. three draws the
    background texture through the tone mapper and back out to sRGB, so the
    rendered sweep lands a few percent darker than the hex below. The overlay
    covers the whole viewport and cross-fades over 420 ms, so the two are never
    on screen side by side and the difference is invisible — but the numbers
    are not identical, and pretending otherwise would send someone hunting for
    a bug that is not there.
  */
  :root {
    --sky-top:    #a2aed0;
    --sky-bottom: #59648a;

    --shell:      #f6f1e7;
    --shell-deep: #e4ddcd;
    --ink:        #2f3348;
    --dim:        #6d7288;
    --coral:      #f47a58;
    --coral-deep: #dc5f45;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--sky-bottom);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    z-index: 10;
    transition: opacity 420ms ease;
  }
  #overlay.is-hidden { opacity: 0; pointer-events: none; }

  .card {
    width: min(430px, calc(100vw - 32px));
    padding: 40px 36px 32px;
    background: var(--shell);
    /*
      A 28px radius, not a 4px one. The card is the first thing anyone sees, so
      it has to make the same promise the geometry does — nothing in this
      project has a hard corner.
    */
    border-radius: 28px;
    text-align: center;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 18px 40px -12px rgba(28, 32, 52, 0.45),
      0 2px 6px rgba(28, 32, 52, 0.16);
  }

  /* The pad palette, as five dots. Says "this is a colourful thing" before the
     WebGL context has drawn a single triangle. */
  .swatches {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-bottom: 22px;
  }
  .swatches i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .swatches i:nth-child(1) { background: hsl(7,   60%, 58%); }
  .swatches i:nth-child(2) { background: hsl(32,  60%, 58%); }
  .swatches i:nth-child(3) { background: hsl(50,  60%, 58%); }
  .swatches i:nth-child(4) { background: hsl(187, 60%, 58%); }
  .swatches i:nth-child(5) { background: hsl(270, 60%, 58%); }

  .title {
    margin: 0 0 8px;
    font-size: 34px;
    font-weight: 650;
    letter-spacing: -0.015em;
  }

  .subtitle {
    margin: 0 0 26px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--dim);
  }

  #start {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #fff;
    background: var(--coral);
    border: none;
    border-radius: 999px;
    padding: 15px 38px;
    cursor: pointer;
    box-shadow: 0 6px 16px -4px rgba(220, 95, 69, 0.6);
    transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
  }
  #start:hover, #start:focus-visible {
    background: var(--coral-deep);
    transform: translateY(-1px);
    outline: none;
  }
  #start:active { transform: translateY(1px); }
  #start:focus-visible { box-shadow: 0 0 0 4px rgba(244, 122, 88, 0.35); }

  .caption {
    margin: 22px 0 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--dim);
  }

  .legend {
    margin: 18px 0 0;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    opacity: 0.75;
  }

  /* Diagnostics readout */
  #status {
    position: fixed;
    left: 16px;
    bottom: 14px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.55);
    pointer-events: none;
    white-space: pre;
    z-index: 5;
  }

  @media (prefers-reduced-motion: reduce) {
    #overlay, #start { transition: none; }
  }
</style>
</head>
<body>

  <canvas id="scene"></canvas>

  <div id="overlay">
    <div class="card">
      <div class="swatches"><i></i><i></i><i></i><i></i><i></i></div>
      <h1 class="title">Drum Rig</h1>
      <p class="subtitle">A 16-pad sequencer in a folding case.<br>Otto is on sticks.</p>
      <button id="start" type="button">Power on</button>
      <p class="caption">Audio starts on your first click — browsers keep it muted until then.</p>
      <p class="legend">Interactive Graphics · Sapienza</p>
    </div>
  </div>

  <div id="status"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
